<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1160" height="680" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1112" height="72" rx="14" fill="url(#hdr)"/>
  <text x="48" y="52" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">pg_yaap Internal Pipeline &amp; Multi-Process Runtime</text>
  <text x="48" y="76" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">Optimizer Physical Plan -&gt; Pipeline Builder -&gt; Event DAG &amp; DSM Ready Queue -&gt; Parallel Background Workers -&gt; OutputSink</text>

  <!-- Step 1: Lowering & Pipeline Builder -->
  <rect x="24" y="110" width="330" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="42" y="136" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">1. Plan Lowering &amp; Pipeline Builder</text>
  <rect x="42" y="150" width="294" height="34" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="189" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">YAAP Optimizer Physical Plan</text>
  <line x1="189" y1="184" x2="189" y2="202" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="42" y="204" width="294" height="60" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="189" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">yaap_pipeline_init / BuildPipelines()</text>
  <text x="189" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Splits at pipeline breakers (HashJoin Build,</text>
  <text x="189" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">HashAgg, TopN, Materialize) into MetaPipelines</text>

  <!-- Step 2: Event DAG & Task Scheduler -->
  <rect x="378" y="110" width="420" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="396" y="136" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">2. Event DAG &amp; DSM Task Queue</text>

  <!-- Event chain -->
  <rect x="396" y="152" width="74" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="433" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">RUN</text>
  <line x1="470" y1="168" x2="494" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="496" y="152" width="84" height="32" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="538" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309">COMBINE</text>
  <line x1="580" y1="168" x2="604" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="606" y="152" width="84" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="648" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#15803d">FINALIZE</text>
  <line x1="690" y1="168" x2="714" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="716" y="152" width="66" height="32" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="749" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#334155">Next</text>
  <text x="749" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#334155">Pipeline</text>

  <!-- DsmTaskQueue box -->
  <rect x="396" y="202" width="386" height="62" rx="7" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="589" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">DsmTaskQueue (Bounded Ring in DSM)</text>
  <text x="589" y="239" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">20-byte TaskDescriptors (pipeline, event, partition, task_id)</text>
  <text x="589" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Lock-free CAS TryPop() + Latch wakeups · Work-stealing across workers</text>

  <!-- Step 3: Leader & Result Delivery -->
  <rect x="822" y="110" width="314" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="840" y="136" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">3. Leader &amp; Result Delivery</text>
  <rect x="840" y="150" width="278" height="52" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="979" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9a3412">PipelineLeader (PG Backend)</text>
  <text x="979" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7c2d12">Spawns workers, waits DAG, collects Trace</text>
  <line x1="979" y1="202" x2="979" y2="218" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="840" y="220" width="278" height="44" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="979" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#991b1b">OutputSink -&gt; TupleTableSlot</text>
  <text x="979" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7f1d1d">Materializes final DataChunks to PG DestReceiver</text>

  <!-- Arrows between Steps 1 -> 2 -> 3 -->
  <line x1="354" y1="195" x2="376" y2="195" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="798" y1="195" x2="820" y2="195" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Middle Row: Worker Execution Processes -->
  <rect x="24" y="302" width="1112" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="42" y="328" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">4. Parallel Background Workers (up to pg_yaap.parallel_max_workers)</text>
  <text x="42" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Each worker attaches DSM/DSA, restores snapshot &amp; MemoryContext, claims tasks via DsmTaskQueue, and executes Source -&gt; Operator(s) -&gt; Sink over DataChunk&lt;2048&gt;</text>

  <!-- Worker 0 box -->
  <rect x="42" y="362" width="760" height="118" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="58" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Worker 0..N-1 Task Execution Loop (Whole-Task RUN / COMBINE / FINALIZE)</text>

  <rect x="58" y="396" width="214" height="70" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="165" y="416" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Source</text>
  <text x="165" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e3a8a">ReadStream Heap Scan</text>
  <text x="165" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e3a8a">+ LLVM JIT Deform / Bloom</text>

  <line x1="272" y1="431" x2="306" y2="431" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="289" y="422" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#2563eb">2048</text>

  <rect x="308" y="396" width="224" height="70" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="420" y="416" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#3730a3">In-Pipeline Operators</text>
  <text x="420" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#312e81">Filter / Projection (in-place)</text>
  <text x="420" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#312e81">Resumable HashJoinProbe</text>

  <line x1="532" y1="431" x2="566" y2="431" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="549" y="422" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#2563eb">2048</text>

  <rect x="568" y="396" width="218" height="70" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="677" y="416" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">Pipeline Sink</text>
  <text x="677" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#064e3b">Radix Join / HashAgg / TopN</text>
  <text x="677" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#064e3b">PerfectHashAgg / Materialize</text>

  <!-- DataChunk spec card -->
  <rect x="822" y="362" width="296" height="118" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="970" y="384" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Columnar Batch: DataChunk&lt;2048&gt;</text>
  <text x="840" y="406" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">- Fixed 2048-row columnar vectors</text>
  <text x="840" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">- Null bitmaps, selection &amp; dictionary cols</text>
  <text x="840" y="442" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">- Scale-2 int64 NUMERICs + string arena</text>
  <text x="840" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">- Vectorized VecExprProgram evaluator</text>

  <!-- Vertical exchange arrows between Queue and Workers -->
  <line x1="589" y1="264" x2="589" y2="360" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Bottom Row: Shared Memory & Storage Layer -->
  <rect x="24" y="518" width="1112" height="142" rx="12" fill="#0f172a"/>
  <text x="46" y="544" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">5. Shared Memory (DSM / DSA), Spill Storage &amp; Native PostgreSQL Layer</text>

  <rect x="46" y="560" width="336" height="82" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="64" y="582" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">DSA Shared Payloads (dsa_pointer)</text>
  <text x="64" y="601" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">Serialized plans, Event DAG counters, Radix join</text>
  <text x="64" y="617" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">directories, TupleDataCollections, Trace buffers</text>
  <text x="64" y="633" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Bounded by pg_yaap.memory_limit / dsa_memory_limit</text>

  <rect x="406" y="560" width="348" height="82" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="424" y="582" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fcd34d">DSM Control &amp; SharedFileSet Spill</text>
  <text x="424" y="601" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">DsmTaskQueue, worker_error.hpp protocol, LWLock</text>
  <text x="424" y="617" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">Soft-limit disk spill &amp; FilePrefetch for Join,</text>
  <text x="424" y="633" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">HashAggregate, Materialize, and PG Tuplesort</text>

  <rect x="778" y="560" width="336" height="82" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="796" y="582" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#86efac">Native PostgreSQL Infrastructure</text>
  <text x="796" y="601" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">Heap storage, Buffer Manager (shared_buffers),</text>
  <text x="796" y="617" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">ReadStream ringless scans, MVCC snapshots</text>
  <text x="796" y="633" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Unmodified PG core; catalog &amp; locks preserved</text>

  <line x1="214" y1="498" x2="214" y2="558" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="580" y1="498" x2="580" y2="558" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="946" y1="498" x2="946" y2="558" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
</svg>
