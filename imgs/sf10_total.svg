    </pattern>
    <pattern id="crash_hatch" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FFE4E6"/>
      <rect width="3.5" height="8" fill="#FF2E63"/>
