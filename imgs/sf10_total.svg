  <text x="36" y="347" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#475569">Controlled run on identical PG 18.3 server (UTF8 tpch, 4GB shared_buffers, 12 parallel workers, 30s cap). See docs/benchmark.md.</text>
